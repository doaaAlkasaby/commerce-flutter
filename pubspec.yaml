name: ecommerce
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  hooks_riverpod: ^3.3.1
  responsive_framework: ^1.5.1
  cached_network_image: ^4.0.3
  flutter_svg: any
  shared_preferences: ^2.5.5
  package_info_plus: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.2
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  assets:
    - assets/lang/
    - assets/images/
    - assets/images/png/
